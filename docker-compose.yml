services:
  angular:
    image: angular-dev
    build: .
    container_name: angular_dev
    # Bind mount no Windows nao propaga eventos de inotify para o container,
    # entao o watcher do Angular precisa fazer polling para ver as alteracoes.
    command: npm start -- --poll=1000
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true
